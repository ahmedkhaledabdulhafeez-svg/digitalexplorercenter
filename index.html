<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز المستكشف الرقمي</title>
<meta name="description" content="بيئة تعلم إلكترونية تفاعلية لمادة الدراسات الاجتماعية للصف الثالث الإعدادي: دروس مصورة وخرائط تفاعلية وشخصيات ثلاثية الأبعاد.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2e1a10;--bg2:#42251a;--panel:#3a2116;--line:rgba(224,160,110,.22);--copper:#c8825a;--gold:#f0b44c;--sand:#f3dcb8;--text:#f6e8d4;--mute:#c9ae94}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ===== header ===== */
header{position:fixed;top:0;inset-inline:0;z-index:60;background:rgba(46,26,16,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:8px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.brand img{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);padding:4px;object-fit:contain}
.brand b{font-family:'Reem Kufi',sans-serif;font-size:1.2rem;color:var(--sand);display:block;line-height:1.3}
.brand small{color:var(--gold);font-size:.74rem;font-weight:600}
.menu{display:none;gap:4px}
.menu a{padding:5px 16px;border-radius:12px;font-size:.88rem;font-weight:600;color:var(--mute);transition:.25s}
.menu a:hover{color:var(--sand);background:rgba(255,255,255,.06)}
@media(min-width:900px){.menu{display:flex}}
.btn{display:inline-flex;align-items:center;gap:10px;padding:9px 24px;border-radius:16px;font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;border:1.5px solid var(--copper);background:var(--copper);color:#2a150b;transition:.3s}
.btn:hover{background:var(--gold);border-color:var(--gold);transform:translateY(-3px);box-shadow:0 12px 28px rgba(240,180,76,.35)}
.btn.ghost{background:transparent;color:var(--gold);border-color:var(--gold)}
.btn.ghost:hover{background:rgba(240,180,76,.14);color:var(--sand);box-shadow:none}
.btn.lg{padding:14px 36px;font-size:1.02rem;border-radius:20px}
.auth{display:flex;gap:10px}
@media(max-width:560px){.brand small{display:none}.btn{padding:8px 14px;font-size:.8rem}.brand b{font-size:1rem}}

/* ===== hero ===== */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;isolation:isolate;border-radius:0 0 54px 54px;padding-top:70px}
.scene{position:absolute;inset:0;z-index:-3}
.scene svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(270deg,var(--bg) 0%,rgba(46,26,16,.93) 34%,rgba(46,26,16,.45) 68%,rgba(46,26,16,.12) 100%),linear-gradient(0deg,var(--bg),rgba(46,26,16,0) 22%)}
.sunc{animation:sp 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.rays{transform-box:view-box;transform-origin:150px 330px;animation:sway 12s ease-in-out infinite alternate}
.bird{animation:fly 16s ease-in-out infinite alternate}.bird path{animation:bob 3s ease-in-out infinite}
.bird path:nth-child(2){animation-delay:-.8s}.bird path:nth-child(3){animation-delay:-1.6s}.bird path:nth-child(4){animation-delay:-2.2s}
@keyframes sp{50%{opacity:.7;transform:scale(1.08)}}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
@keyframes fly{from{transform:translateX(60px)}to{transform:translateX(-160px)}}
@keyframes bob{50%{transform:translateY(-14px)}}

/* أشكال متحولة وإضاءات */
.fx{position:absolute;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;filter:blur(46px);border-radius:60% 40% 30% 70%/60% 30% 70% 40%;animation:morph 13s ease-in-out infinite alternate,drift 19s ease-in-out infinite alternate}
.b1{width:420px;height:420px;left:-80px;top:8%;background:radial-gradient(circle,rgba(240,180,76,.55),transparent 70%)}
.b2{width:360px;height:360px;right:6%;bottom:6%;background:radial-gradient(circle,rgba(200,130,90,.5),transparent 70%);animation-delay:-5s}
.b3{width:280px;height:280px;left:38%;top:-60px;background:radial-gradient(circle,rgba(255,226,150,.4),transparent 70%);animation-delay:-9s}
@keyframes morph{0%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}100%{border-radius:50% 50% 40% 60%/40% 70% 40% 60%}}
@keyframes drift{to{transform:translate(50px,36px) rotate(25deg)}}
.shp{position:absolute;border:2px solid rgba(240,180,76,.4);animation:spin 26s linear infinite}
.s1{width:90px;height:90px;right:9%;top:22%;transform:rotate(45deg);border-radius:22px}
.s2{width:56px;height:56px;left:46%;bottom:14%;border-radius:50%;animation-duration:18s;animation-direction:reverse}
.s3{width:130px;height:130px;left:10%;bottom:10%;border-radius:36px;animation-duration:38s;border-color:rgba(255,255,255,.2)}
.fi{position:absolute;font-size:2rem;opacity:.5;animation:flo 6s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.f1{right:8%;bottom:20%}.f2{left:42%;top:15%;animation-delay:-2s}.f3{right:30%;top:12%;animation-delay:-4s}.f4{left:6%;top:30%;animation-delay:-1s}
@keyframes flo{50%{transform:translateY(-22px) rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.dust{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);opacity:0;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70vh);opacity:0}}

.hero .in{max-width:1240px;margin:auto;width:100%;padding:60px 24px 90px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.tag{display:inline-block;border:1px solid var(--copper);color:var(--gold);padding:3px 18px;border-radius:99px;font-size:.82rem;font-weight:700;margin-bottom:16px;background:rgba(200,130,90,.14)}
h1.big{font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:clamp(2.3rem,5.4vw,4rem);line-height:1.45;background:linear-gradient(100deg,var(--copper) 20%,var(--gold) 45%,#fff2c8 55%,var(--gold) 65%,var(--copper) 85%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.lead{color:var(--mute);max-width:520px;margin:16px 0 28px;font-size:1.05rem}
.cta{display:flex;gap:14px;flex-wrap:wrap}

/* الشعار المتحرك */
.logo-wrap{display:grid;place-items:center}
.orb{position:relative;width:min(340px,72vw);aspect-ratio:1}
.halo{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,150,.5),transparent 62%);animation:sp 4s ease-in-out infinite}
.ring{position:absolute;border-radius:50%}
.r1{inset:0;border:2px dashed rgba(240,180,76,.6);animation:spin 32s linear infinite}
.r2{inset:-24px;border:1px solid rgba(240,180,76,.3);animation:spin 50s linear infinite reverse}
.r3{inset:-8px;background:conic-gradient(from 0deg,transparent 0 68%,var(--gold) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 5s linear infinite}
.orbit{position:absolute;inset:-24px;border-radius:50%;animation:spin 14s linear infinite}
.orbit i{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px 4px rgba(240,180,76,.8)}
.orbit.o2{inset:-8px;animation-duration:9s;animation-direction:reverse}.orbit.o2 i{width:10px;height:10px;background:#fff2c8;top:-5px}
.orbit.o3{inset:-24px;animation-duration:21s;transform:rotate(120deg)}.orbit.o3 i{background:var(--copper);box-shadow:0 0 16px 3px rgba(200,130,90,.9)}
.core{position:absolute;inset:11%;border-radius:50%;display:grid;place-items:center;padding:11%;overflow:hidden;
  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.32);box-shadow:0 0 90px rgba(240,180,76,.6),inset 0 0 40px rgba(255,255,255,.12);animation:float 6s ease-in-out infinite}
.core::after{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%);animation:sweep 5s ease-in-out infinite}
.core img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes sweep{0%,30%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@media(max-width:900px){.hero .in{grid-template-columns:1fr;text-align:center;padding-top:40px}.logo-wrap{order:-1}.orb{width:min(250px,64vw)}.lead{margin-inline:auto}.cta{justify-content:center}
  .hero::after{background:linear-gradient(0deg,var(--bg) 0%,rgba(46,26,16,.88) 50%,rgba(46,26,16,.5) 100%)}}

/* ===== أقسام ===== */
.wrap{max-width:1240px;margin:auto;padding:0 20px}
section.blk{padding:70px 0 10px}
.head{display:flex;align-items:center;gap:16px;margin-bottom:30px}
.head .ic{border-radius:18px;width:56px;height:56px;border:1px solid var(--copper);display:grid;place-items:center;font-size:1.6rem;background:rgba(200,130,90,.12);transform:rotate(45deg);flex-shrink:0;margin:6px}
.head .ic i{transform:rotate(-45deg);font-style:normal}
.head h2{font-family:'Reem Kufi',sans-serif;font-size:clamp(1.5rem,3.4vw,2.2rem);color:var(--sand);line-height:1.4}
.head p{color:var(--mute);font-size:.92rem}

/* المميزات */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin-top:-40px;position:relative;z-index:3}
.fc{position:relative;overflow:hidden;padding:28px 24px;border-radius:28px;background:linear-gradient(160deg,var(--bg2),var(--panel));border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4);transition:transform .35s,border-color .35s,box-shadow .35s}
.fc::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.fc:hover{transform:translateY(-8px);border-color:var(--c);box-shadow:0 26px 50px rgba(0,0,0,.45),0 0 36px -10px var(--c)}
.fc .mi{width:62px;height:62px;display:grid;place-items:center;font-size:1.8rem;margin-bottom:14px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c);border-radius:60% 40% 30% 70%/60% 30% 70% 40%;animation:morph 9s ease-in-out infinite alternate}
.fc h3{font-family:'Reem Kufi',sans-serif;font-size:1.3rem;color:var(--sand)}
.fc p{color:var(--mute);font-size:.9rem}

/* الفيديو */
.frame{border-radius:28px;position:relative;padding:12px;border:1px solid var(--line);background:linear-gradient(145deg,var(--bg2),var(--panel));box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 80px -30px var(--gold);max-width:960px;margin:auto}
.frame::before,.frame::after{content:"";position:absolute;width:46px;height:46px;border:3px solid var(--gold)}
.frame::before{top:-6px;right:-6px;border-left:0;border-bottom:0;border-top-right-radius:28px}
.frame::after{bottom:-6px;left:-6px;border-right:0;border-top:0;border-bottom-left-radius:28px}
.vid{border-radius:18px;position:relative;aspect-ratio:16/9;overflow:hidden;background:#1d0f08}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ===== الإشراف والإعداد ===== */
.uni{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 30px;border-radius:28px;margin-bottom:44px;background:linear-gradient(135deg,var(--bg2),var(--panel));border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative;overflow:hidden}
.uni::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--gold),var(--copper),var(--gold))}
.uni img{width:72px;height:72px;border-radius:50%;background:#fff;padding:5px;object-fit:contain;flex-shrink:0}
.uni div{text-align:center}.uni h3{font-family:'Reem Kufi',sans-serif;font-size:1.5rem;color:var(--gold)}.uni p{color:var(--mute);font-size:.9rem}
@media(max-width:640px){.uni{flex-wrap:wrap;justify-content:center}.uni div{order:3;flex-basis:100%}}

.grp{margin-bottom:54px;--c:var(--copper)}
.grp.sup{--c:var(--gold)}

.sub{display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.sub h3{font-family:'Reem Kufi',sans-serif;font-size:1.65rem;color:var(--c);display:flex;align-items:center;gap:14px}
.sub h3::before,.sub h3::after{content:"";width:42px;height:4px;border-radius:99px;background:var(--c)}

/* شبكة الإشراف: بطاقتين كبار في المنتصف */
.sup-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:34px;max-width:860px;margin:auto}
.sup-grid .person{width:350px;max-width:100%;padding:36px 26px 30px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.sup-grid .av{width:154px;height:154px;margin-bottom:20px;border-width:4px}
.sup-grid .person b{font-size:1.25rem;margin-bottom:6px}
.sup-grid .person .role-badge{font-size:.9rem;padding:4px 16px}

/* شبكة الإعداد: 6 بطاقات متناسقة (3 فوق و 3 تحت) */
.prep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:960px;margin:auto}

@media(max-width:860px){
  .prep-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:540px){
  .prep-grid{grid-template-columns:1fr;max-width:340px}
}

.person{text-align:center;padding:28px 18px 24px;border-radius:28px;background:linear-gradient(160deg,var(--bg2),var(--panel));border:1px solid var(--line);position:relative;overflow:hidden;transition:.35s;display:flex;flex-direction:column;align-items:center}
.person::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.person:hover{transform:translateY(-7px);border-color:var(--c);box-shadow:0 22px 44px rgba(0,0,0,.45),0 0 32px -10px var(--c)}
.av{width:118px;height:118px;margin:0 auto 16px;border-radius:50%;overflow:hidden;border:3px solid var(--c);padding:4px;background:radial-gradient(circle at 50% 35%,#6a3f2b,#3a2116);box-shadow:0 0 26px -6px var(--c)}
.av svg,.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.person b{display:block;color:var(--sand);font-size:1.08rem;margin-bottom:6px}
.role-badge{display:inline-block;padding:3px 14px;border-radius:99px;font-size:.82rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}

.strip{border-radius:99px;height:10px;margin-top:60px;background:repeating-linear-gradient(90deg,var(--copper) 0 18px,transparent 18px 26px,var(--gold) 26px 34px,transparent 34px 42px);opacity:.7}
footer{background:#24130b;text-align:center;padding:26px 16px;color:var(--mute);font-weight:600;font-size:.88rem;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s,transform .9s}.rv.show{opacity:1;transform:none}

/* ===== نافذة الدخول ===== */
.ov{position:fixed;inset:0;z-index:100;background:rgba(20,11,6,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.ov.on{display:flex}
.box{position:relative;width:100%;max-width:440px;padding:32px 32px 28px;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#4a2a1c,#3a2116);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 70px -20px var(--copper);animation:pop .35s ease;margin:auto}
.box::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--copper),var(--gold),var(--copper))}
@keyframes pop{from{transform:scale(.92) translateY(14px);opacity:0}}
.x{position:absolute;top:14px;left:16px;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--mute);font-size:1.3rem;cursor:pointer;transition:.25s}
.x:hover{color:var(--gold);border-color:var(--gold)}
.mlogo{width:110px;height:110px;margin:0 auto 10px;display:grid;place-items:center;position:relative}
.mlogo::before{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(240,180,76,.32) 0%,transparent 70%);filter:blur(12px);z-index:0}
.mlogo img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.tabs{display:flex;gap:6px;padding:5px;border-radius:18px;background:rgba(0,0,0,.25);margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:14px;border:0;background:transparent;color:var(--mute);font-family:inherit;font-weight:800;font-size:.92rem;cursor:pointer;transition:.3s}
.tabs button.on{background:var(--copper);color:#2a150b}
.box h3{font-family:'Reem Kufi',sans-serif;font-size:1.6rem;color:var(--copper);text-align:center;line-height:1.4}
.box .s{text-align:center;color:var(--mute);font-size:.86rem;margin:2px 0 16px}
form{display:flex;flex-direction:column;gap:13px}
label{display:block;font-weight:700;font-size:.85rem;color:var(--sand);margin-bottom:4px}
input{width:100%;padding:12px 16px;border-radius:18px;font-size:.94rem;font-family:inherit;color:var(--text);background:rgba(0,0,0,.25);border:1.5px solid var(--line);outline:none;transition:.3s}
input::placeholder{color:rgba(201,174,148,.55)}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(240,180,76,.15);background:rgba(0,0,0,.35)}
.submit{width:100%;justify-content:center;padding:13px;font-size:1rem;margin-top:2px;border-radius:18px}
.submit:disabled,.btn-google:disabled{opacity:.65;cursor:not-allowed;transform:none}
.auth-err{color:#ff8a80;font-size:.84rem;font-weight:700;text-align:center;min-height:18px;margin-top:-2px}
.divider{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.82rem;margin:0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{width:100%;justify-content:center;padding:12px;font-size:.95rem;border-radius:18px;background:rgba(255,255,255,.06);color:var(--sand);border:1.5px solid var(--line)}
.btn-google:hover{background:rgba(240,180,76,.14);border-color:var(--gold);color:#fff;transform:translateY(-2px);box-shadow:none}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* حماية الصور من التحميل والسحب */
img {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

/* ===== شاشة التحميل ===== */
#auth-preloader{position:fixed;inset:0;z-index:999999;background:radial-gradient(circle at center,#4a2a1c 0%,#2e1a10 75%,#22120a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .4s ease,visibility .4s ease}
#auth-preloader.hide{opacity:0;visibility:hidden;pointer-events:none}
#auth-preloader .loader-orb{position:relative;width:155px;height:155px;display:grid;place-items:center}
#auth-preloader .loader-halo{position:absolute;inset:-24%;border-radius:50%;background:radial-gradient(circle,rgba(240,180,76,.38),transparent 65%);animation:authHaloPulse 2.4s ease-in-out infinite}
#auth-preloader .loader-ring-outer{position:absolute;inset:0;border-radius:50%;border:2.5px dashed rgba(240,180,76,.65);animation:authSpin 14s linear infinite}
#auth-preloader .loader-ring-inner{position:absolute;inset:10px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 65%,#f0b44c 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 2.5px));animation:authSpinReverse 2.2s linear infinite}
#auth-preloader .loader-core{position:relative;z-index:2;width:112px;height:112px;border-radius:50%;padding:12px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid rgba(240,180,76,.45);box-shadow:0 0 40px rgba(240,180,76,.35),inset 0 0 20px rgba(255,255,255,.1);display:grid;place-items:center;overflow:hidden
