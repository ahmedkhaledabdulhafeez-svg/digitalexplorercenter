<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مصر في عصر خلفاء محمد علي — المستكشف الرقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --royal-950: #091326;
    --royal-900: #10203d;
    --royal-800: #183059;
    --gold: #d4a843;
    --gold-light: #f0cf7b;
    --cream: #faf7f0;
    --ink: #172033;
    --muted: #5b657a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: radial-gradient(circle at top, #183059 0%, #091326 65%);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* شريط التقدم العلوي */
  .progress-track {
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.1);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width 0.35s ease;
  }

  /* الهيدر */
  header.deck-header {
    background: rgba(9, 19, 38, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(212, 168, 67, 0.28);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #9c7421);
    color: var(--royal-950);
    font-weight: 800;
    font-size: 1.1rem;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 14px rgba(212, 168, 67, 0.3);
  }

  .brand-titles h1 {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--gold-light);
    line-height: 1.3;
  }

  .brand-titles p {
    font-size: 0.78rem;
    color: #c7d2e8;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-overview {
    background: rgba(212, 168, 67, 0.14);
    color: var(--gold-light);
    border: 1px solid rgba(212, 168, 67, 0.45);
    padding: 7px 14px;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-overview:hover {
    background: var(--gold);
    color: var(--royal-950);
  }

  .slide-counter {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--gold-light);
    background: rgba(255, 255, 255, 0.06);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  /* منطقة العرض الرئيسية */
  main.stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .slide-card {
    width: 100%;
    max-width: 1040px;
    background: var(--cream);
    color: var(--ink);
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    border: 2px solid rgba(212, 168, 67, 0.45);
    overflow: hidden;
    animation: slideFadeIn 0.35s ease;
  }

  @keyframes slideFadeIn {
    from {
      opacity: 0;
      transform: translateY(10px) scale(0.99);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .slide-body {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    min-height: 500px;
  }

  .slide-content {
    padding: 34px 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .slide-tag {
    display: inline-block;
    width: fit-content;
    background: rgba(16, 32, 61, 0.08);
    color: var(--royal-800);
    border-right: 4px solid var(--gold);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .slide-title {
    font-family: 'Amiri', serif;
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--royal-950);
    line-height: 1.25;
    margin-bottom: 10px;
  }

  .slide-subtitle {
    font-size: 1rem;
    font-weight: 700;
    color: #966d18;
    margin-bottom: 18px;
  }

  .slide-points {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .slide-points li {
    position: relative;
    padding-right: 22px;
    font-size: 0.98rem;
    line-height: 1.65;
    color: var(--ink);
  }

  .slide-points li::before {
    content: "◆";
    position: absolute;
    right: 0;
    top: 1px;
    color: #b68621;
    font-size: 0.85rem;
  }

  .slide-note {
    margin-top: 18px;
    background: #f2ece0;
    border: 1px solid #dfd3ba;
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 0.88rem;
    color: #3a4559;
    line-height: 1.55;
  }

  .slide-visual {
    background: linear-gradient(160deg, var(--royal-900), var(--royal-950));
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border-right: 1px solid rgba(212, 168, 67, 0.25);
  }

  .slide-visual img {
    width: 100%;
    max-height: 360px;
    object-fit: cover;
    border-radius: 16px;
    border: 2px solid rgba(212, 168, 67, 0.55);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
  }

  .slide-caption {
    font-size: 0.82rem;
    color: #dce5f7;
    text-align: center;
    line-height: 1.45;
  }

  /* شريط التحكم السفلي */
  footer.deck-footer {
    background: rgba(9, 19, 38, 0.92);
    border-top: 1px solid rgba(212, 168, 67, 0.22);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .nav-btn {
    background: var(--gold);
    color: var(--royal-950);
    border: none;
    padding: 9px 20px;
    border-radius: 11px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.92rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease;
  }

  .nav-btn:hover:not(:disabled) {
    background: var(--gold-light);
    transform: translateY(-1px);
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .dots-container {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dot-btn {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .dot-btn.active {
    width: 26px;
    border-radius: 999px;
    background: var(--gold);
  }

  /* نافذة فهرس الشرائح */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 11, 22, 0.78);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    width: 100%;
    max-width: 780px;
    max-height: 85vh;
    overflow-y: auto;
    background: var(--royal-900);
    border: 1px solid rgba(212, 168, 67, 0.45);
    border-radius: 20px;
    padding: 24px;
    color: var(--cream);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .modal-header h2 {
    font-size: 1.15rem;
    color: var(--gold-light);
  }

  .btn-close {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
  }

  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
  }

  .overview-item {
    text-align: right;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(212, 168, 67, 0.25);
    border-radius: 14px;
    padding: 12px 14px;
    color: var(--cream);
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .overview-item:hover,
  .overview-item.current {
    background: rgba(212, 168, 67, 0.18);
    border-color: var(--gold);
  }

  .overview-item .num {
    font-size: 0.78rem;
    color: var(--gold-light);
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }

  .overview-item .stitle {
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.4;
  }

  @media (max-width: 820px) {
    .slide-body {
      grid-template-columns: 1fr;
    }

    .slide-visual {
      border-right: none;
      border-top: 1px solid rgba(212, 168, 67, 0.25);
    }

    .slide-content {
      padding: 24px 20px;
    }

    .slide-title {
      font-size: 1.7rem;
    }
  }
</style>
</head>
<body>

    let currentIndex = 0;

    const slideCard = document.getElementById("slideCard");
    const slideCounter = document.getElementById("slideCounter");
    const progressBar = document.getElementById("progressBar");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dotsContainer = document.getElementById("dotsContainer");
    const overviewModal = document.getElementById("overviewModal");
    const openOverviewBtn = document.getElementById("openOverviewBtn");
    const closeOverviewBtn = document.getElementById("closeOverviewBtn");
    const overviewGrid = document.getElementById("overviewGrid");

    function renderSlide(index) {
      currentIndex = Math.max(0, Math.min(index, SLIDES.length - 1));
      const slide = SLIDES[currentIndex];

      slideCard.style.animation = "none";
      void slideCard.offsetWidth;
      slideCard.style.animation = "slideFadeIn 0.35s ease";

      const pointsHtml = slide.points.map((pt) => `<li>${pt}</li>`).join("");

      slideCard.innerHTML = `
        <div class="slide-body">
          <div class="slide-content">
            <span class="slide-tag">${slide.tag}</span>
            <h2 class="slide-title">${slide.title}</h2>
            <p class="slide-subtitle">${slide.subtitle}</p>
            <ul class="slide-points">${pointsHtml}</ul>
            ${slide.note ? `<div class="slide-note">${slide.note}</div>` : ""}
          </div>
          <div class="slide-visual">
            <img src="${slide.image}" alt="${slide.title}" onerror="this.onerror=null;this.src='${FALLBACK_SVG}';" />
            <p class="slide-caption">${slide.caption}</p>
          </div>
        </div>
      `;

      slideCounter.textContent = `${currentIndex + 1} / ${SLIDES.length}`;
      progressBar.style.width = `${((currentIndex + 1) / SLIDES.length) * 100}%`;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === SLIDES.length - 1;

      updateDots();
      updateOverviewActive();
    }

    function buildDots() {
      dotsContainer.innerHTML = "";
      SLIDES.forEach((s, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dot-btn" + (idx === currentIndex ? " active" : "");
        btn.setAttribute("aria-label", `الانتقال إلى الشريحة ${idx + 1}: ${s.title}`);
        btn.addEventListener("click", () => renderSlide(idx));
        dotsContainer.appendChild(btn);
      });
    }

    function updateDots() {
      const buttons = dotsContainer.querySelectorAll(".dot-btn");
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === currentIndex);
      });
    }

    function buildOverview() {
      overviewGrid.innerHTML = "";
      SLIDES.forEach((s, idx) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "overview-item" + (idx === currentIndex ? " current" : "");
        item.innerHTML = `
          <span class="num">شريحة ${idx + 1}</span>
          <span class="stitle">${s.title}</span>
        `;
        item.addEventListener("click", () => {
          renderSlide(idx);
          closeOverview();
        });
        overviewGrid.appendChild(item);
      });
    }

    function updateOverviewActive() {
      const items = overviewGrid.querySelectorAll(".overview-item");
      items.forEach((item, idx) => {
        item.classList.toggle("current", idx === currentIndex);
      });
    }

    function openOverview() {
      overviewModal.classList.add("open");
      overviewModal.setAttribute("aria-hidden", "false");
    }

    function closeOverview() {
      overviewModal.classList.remove("open");
      overviewModal.setAttribute("aria-hidden", "true");
    }

    prevBtn.addEventListener("click", () => renderSlide(currentIndex - 1));
    nextBtn.addEventListener("click", () => renderSlide(currentIndex + 1));
    openOverviewBtn.addEventListener("click", openOverview);
    closeOverviewBtn.addEventListener("click", closeOverview);

    overviewModal.addEventListener("click", (e) => {
      if (e.target === overviewModal) closeOverview();
    });

    document.addEventListener("keydown", (e) => {
      if (overviewModal.classList.contains("open")) {
        if (e.key === "Escape") closeOverview();
        return;
      }
      if (e.key === "ArrowLeft") renderSlide(currentIndex + 1);
      if (e.key === "ArrowRight") renderSlide(currentIndex - 1);
    });

    buildDots();
    buildOverview();
    renderSlide(0);
  </script>
